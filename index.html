<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập: Gọi bạn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{--sky1:#7fd4ff;--sky2:#d8f4ff;--card:#fff;--tx:#241a4a;--mu:#5b4f85;--bd:#ffb703;--t1:#ff7a00;--t1b:#fff1d6;--t2:#1b8cff;--t2b:#dcefff;--ok:#12a150;--bad:#e5334b;--ca:#ffd9ea;--cac:#ff4f93;--cb:#fff2a6;--cbc:#f2a900;--cc:#c9f5d6;--ccc:#1db954;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1c3a7a;--sky2:#35296b;--card:#2a2656;--tx:#fffaf0;--mu:#d6ccf5;--t1b:#4d3520;--t2b:#1f3a63;--ca:#5c2f52;--cb:#5b5224;--cc:#24533c}}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:"Baloo 2","Segoe UI",Roboto,Arial,sans-serif;font-size:18px;background:linear-gradient(var(--sky1),var(--sky2));background-attachment:fixed}
body:after{content:"";position:fixed;left:0;right:0;bottom:0;height:42px;background:#4fc65a;border-top:5px solid #2ea84a;pointer-events:none}
.gr{position:fixed;left:0;right:0;bottom:4px;height:40px;display:flex;justify-content:space-around;align-items:center;font-size:28px;z-index:2;pointer-events:none}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px;height:100vh;padding:8px 14px 50px;max-width:1700px;margin:0 auto}
.sb{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.tm{background:var(--card);border:4px solid;border-radius:24px;padding:4px 14px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tm .av{animation:bn 1.6s ease-in-out infinite;line-height:0}.tm .av svg{width:clamp(48px,9vh,84px);height:auto}
.tm .nm{font-size:clamp(15px,2.4vh,24px);font-weight:800;line-height:1.05}
.tm .s{display:block;font-size:clamp(34px,6.5vh,64px);font-weight:800;line-height:1}
.s.pop{animation:pp .6s}
@keyframes bn{50%{transform:translateY(-6px) rotate(-5deg)}}@keyframes pp{40%{transform:scale(1.5)}}
.t1{border-color:var(--t1);background:var(--t1b)}.t1 .nm,.t1 .s{color:var(--t1)}.t2{border-color:var(--t2);background:var(--t2b)}.t2 .nm,.t2 .s{color:var(--t2)}
.mid{flex-direction:column;gap:0;min-width:130px;border-color:var(--bd)}
.ring{--p:100;width:clamp(60px,10vh,92px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),#e3dcf5 0)}
.ring span{width:78%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:clamp(24px,4.4vh,40px);font-weight:800}
.ring.lo{background:conic-gradient(var(--bad) calc(var(--p)*1%),#e3dcf5 0);animation:sh .4s infinite}
.meta{font-size:clamp(14px,2vh,20px);color:var(--mu);font-weight:700}
.qc{min-height:0;display:flex;flex-direction:column}#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:5px solid var(--bd);border-radius:28px;padding:10px 20px 14px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.qcard{flex:1;min-height:0;display:flex;flex-direction:column}
.badge{align-self:flex-start;background:var(--bd);color:#3a2700;border-radius:20px;padding:0 14px;font-weight:800;font-size:clamp(15px,2.2vh,22px)}
.q{font-size:clamp(24px,min(4.6vh,3.1vw),50px);font-weight:800;line-height:1.18;margin:6px 0}
.opts{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:8px}
.opt{display:flex;gap:14px;align-items:center;padding:4px 14px 4px 8px;border-radius:22px;font-size:clamp(20px,min(3.9vh,2.5vw),40px);font-weight:800;line-height:1.1;border:5px solid;transition:transform .2s}
.opt.c0{background:var(--ca);border-color:var(--cac)}.opt.c1{background:var(--cb);border-color:var(--cbc)}.opt.c2{background:var(--cc);border-color:var(--ccc)}
.opt .bd{min-width:clamp(70px,7vw,120px);text-align:center;color:#fff;border-radius:16px;padding:2px 4px;line-height:1}
.c0 .bd{background:var(--cac)}.c1 .bd{background:var(--cbc)}.c2 .bd{background:var(--ccc)}
.opt .bd i{display:block;font-style:normal;font-size:clamp(28px,5vh,52px)}.opt .bd small{font-size:clamp(12px,1.8vh,18px);font-weight:800}
.opt.right{box-shadow:0 0 0 7px rgba(18,161,80,.45);transform:scale(1.02);animation:pp2 .7s}.opt.dim{opacity:.35}
@keyframes pp2{50%{transform:scale(1.06)}}
.rc{min-height:0;display:flex;flex-direction:column;gap:8px}
.cam{position:relative;flex:1;min-height:0;background:#1b1536;border:5px solid #fff;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.c0{border-color:var(--t1)}.c1{border-color:var(--t2)}.lbw{position:absolute;left:6px;right:6px;bottom:6px}.sm{font-size:clamp(16px,2.6vh,24px);padding:6px 16px}
.half{position:absolute;top:0;bottom:0;width:50%;border:4px solid;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;pointer-events:none}
.h0{left:0;border-color:var(--t1)}.h1{right:0;border-color:var(--t2)}
.lb{background:rgba(20,12,50,.82);color:#fff;border-radius:14px;padding:2px 10px;font-weight:800;font-size:clamp(14px,2.3vh,22px);text-align:center}
.pg{height:8px;background:rgba(255,255,255,.3);border-radius:6px;margin-top:4px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:#ffd23f}
.cmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#fff;padding:14px;background:rgba(27,21,54,.9);font-weight:700}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pn{border:4px solid;border-radius:20px;padding:6px 8px;background:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.pn h3{margin:0 0 4px;font-size:clamp(13px,2vh,18px)}.pn .b{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:6px}
button{font:inherit;font-weight:800;cursor:pointer;border-radius:16px;border:0;background:#fff;color:#241a4a;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.pn .b button{font-size:clamp(22px,3.6vh,34px);line-height:1;min-height:clamp(40px,6vh,56px)}
.pn .b button.sel{background:#ffd23f;outline:4px solid #241a4a}.pn button:disabled{opacity:.5;cursor:default}
.st{min-height:22px;margin-top:2px;font-size:clamp(13px,2vh,19px);font-weight:800}.ok{color:var(--ok)}.no{color:var(--bad)}
.act{display:flex;gap:10px;justify-content:center}
.big{background:linear-gradient(#ff9a3c,#ff5e3a);color:#fff;font-size:clamp(20px,3.6vh,34px);padding:6px 34px;border-radius:30px}
.alt{font-size:clamp(18px,3vh,28px);padding:6px 26px;border-radius:26px;background:#ffd23f}
.c{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;flex:1}
.hero{display:flex;gap:16px}.hero svg{animation:bn 1.6s infinite}.fr{font-size:clamp(30px,5vh,48px);letter-spacing:8px}
.cf{position:fixed;top:-40px;font-size:38px;z-index:9;pointer-events:none;animation:fl 1.8s ease-in forwards}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:900px),(max-height:520px){.app{display:block;height:auto}.sb{margin-bottom:8px}.cam{aspect-ratio:4/3;margin:8px 0}.ctl{grid-template-columns:1fr}.qc{order:-1}.opts{grid-auto-rows:auto}.tm{flex-direction:column;gap:0}}
</style></head><body><div class="app">
<div class="sb">
<div class="tm t1"><span class="av" id="a1"></span><div><span class="nm">ĐỘI BÊ VÀNG</span><span class="s" id="s1">0</span></div></div>
<div class="tm mid"><span id="no" class="meta">Câu 0/22</span><div class="ring" id="rg"><span id="clk">30</span></div></div>
<div class="tm t2"><span class="av" id="a2"></span><div><span class="nm">ĐỘI DÊ TRẮNG</span><span class="s" id="s2">0</span></div></div>
</div>
<div class="rc"><div class="cam c0"><canvas id="cv0"></canvas><div class="lbw"><div class="lb" id="l0">🐮 Bê vàng</div><div class="pg"><i id="p0"></i></div></div><div class="cmsg" id="cm0"><div style="font-size:clamp(14px,2.2vh,22px)">📷 Bạn đại diện đội<br>🐮 Bê vàng<br>đứng ở khung này</div><button class="big sm" onclick="startCam()">📷 Bật camera</button><div class="meta" style="color:#d6ccf5" id="cn0">Hoặc dùng nút bấm bên dưới</div></div></div><div class="ctl" id="ctl0"></div></div>
<div class="qc"><div id="main"></div></div>
<div class="rc"><div class="cam c1"><canvas id="cv1"></canvas><div class="lbw"><div class="lb" id="l1">🐐 Dê trắng</div><div class="pg"><i id="p1"></i></div></div><div class="cmsg" id="cm1"><div style="font-size:clamp(14px,2.2vh,22px)">📷 Bạn đại diện đội<br>🐐 Dê trắng<br>đứng ở khung này</div><button class="big sm" onclick="startCam()">📷 Bật camera</button><div class="meta" style="color:#d6ccf5" id="cn1">Hoặc dùng nút bấm bên dưới</div></div></div><div class="ctl" id="ctl1"></div></div>
<video id="v" playsinline muted style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<div class="gr"><span>🌳</span><span>🌼</span><span>🍎</span><span>🐰</span><span>🌷</span><span>🍓</span><span>🌳</span><span>🦋</span><span>🍌</span><span>🐿️</span><span>🌻</span><span>🌳</span></div>
<script>
var TL=30,B=50,P=100,HOLD=800;
var A=[["☝️","1 ngón"],["✌️","2 ngón"],["🤟","3 ngón"]];
function eyes(){return '<circle cx="36" cy="50" r="8" fill="#2b2140"/><circle cx="64" cy="50" r="8" fill="#2b2140"/><circle cx="33.5" cy="47" r="3" fill="#fff"/><circle cx="61.5" cy="47" r="3" fill="#fff"/><ellipse cx="24" cy="62" rx="6" ry="4" fill="#ff7b9c" opacity=".7"/><ellipse cx="76" cy="62" rx="6" ry="4" fill="#ff7b9c" opacity=".7"/>'}
function calf(s){return '<svg viewBox="0 0 100 100" width="'+s+'" height="'+s+'"><ellipse cx="13" cy="42" rx="13" ry="7" transform="rotate(-25 13 42)" fill="#f08a24"/><ellipse cx="87" cy="42" rx="13" ry="7" transform="rotate(25 87 42)" fill="#f08a24"/><path d="M30 22Q26 6 37 9Q39 18 39 24ZM70 22Q74 6 63 9Q61 18 61 24Z" fill="#ffe27a" stroke="#c98f00" stroke-width="2"/><circle cx="50" cy="52" r="35" fill="#ffa94d" stroke="#c75a0f" stroke-width="3"/><ellipse cx="50" cy="68" rx="19" ry="13" fill="#ffe3bf"/><circle cx="43" cy="67" r="2.5" fill="#8a4a1a"/><circle cx="57" cy="67" r="2.5" fill="#8a4a1a"/>'+eyes()+'<path d="M43 75Q50 82 57 75" fill="none" stroke="#8a4a1a" stroke-width="2.5" stroke-linecap="round"/></svg>'}
function goat(s){return '<svg viewBox="0 0 100 100" width="'+s+'" height="'+s+'"><ellipse cx="12" cy="48" rx="14" ry="7" transform="rotate(20 12 48)" fill="#ffc2d6" stroke="#8d86b8" stroke-width="2.5"/><ellipse cx="88" cy="48" rx="14" ry="7" transform="rotate(-20 88 48)" fill="#ffc2d6" stroke="#8d86b8" stroke-width="2.5"/><path d="M34 22Q22 4 38 6M66 22Q78 4 62 6" fill="none" stroke="#ffb703" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="52" r="35" fill="#fff" stroke="#8d86b8" stroke-width="3"/><ellipse cx="50" cy="68" rx="17" ry="12" fill="#efe9ff"/><ellipse cx="50" cy="62" rx="4" ry="3" fill="#ff8fab"/>'+eyes()+'<path d="M43 71Q50 78 57 71" fill="none" stroke="#6b5f9a" stroke-width="2.5" stroke-linecap="round"/><path d="M50 82Q46 95 50 97Q54 95 50 82Z" fill="#fff" stroke="#8d86b8" stroke-width="2"/></svg>'}
var Q=[
["Bài thơ có tên là gì?",["Gọi bạn","Tìm bạn","Nhớ bạn"],0],
["Tác giả bài thơ là ai?",["Võ Quảng","Trần Đăng Khoa","Định Hải"],2],
["Đôi bạn trong bài thơ là ai?",["Sóc và thỏ","Bê vàng và dê trắng","Bê vàng và nhím"],1],
["Đôi bạn sống ở đâu?",["Trong rừng xanh","Bên bờ biển","Trong thành phố"],0],
["Câu chuyện xảy ra khi nào?",["Mùa xuân","Một năm hạn hán","Mùa đông"],1],
["“Sâu thẳm” nghĩa là gì?",["Rất cao","Rất rộng","Rất sâu"],2],
["“Hạn hán” là gì?",["Lâu ngày không mưa","Mưa nhiều gây lụt","Gió to, bão lớn"],0],
["“Lang thang” nghĩa là gì?",["Đi thẳng về nhà","Đi hết nơi này đến nơi khác","Ngồi yên một chỗ"],1],
["Khi hạn hán, suối và cỏ thế nào?",["Suối đầy, cỏ xanh","Suối chảy mạnh","Suối cạn, cỏ héo khô"],2],
["Vì sao bê vàng đi tìm cỏ?",["Cỏ héo khô, hết thức ăn","Thích đi chơi","Muốn tìm bạn mới"],0],
["Bê vàng đi tìm cỏ thì gặp chuyện gì?",["Gặp mưa to","Quên đường về","Bị ốm"],1],
["Bê vàng quên đường về, dê trắng làm gì?",["Ở nhà ngủ","Đi tìm cỏ khác","Chạy khắp nẻo tìm bê"],2],
["Dê trắng vẫn gọi hoài thế nào?",["“Bê! Bê!”","“Dê! Dê!”","“Bạn ơi!”"],0],
["Tâm trạng của dê trắng khi không thấy bạn?",["Vui vẻ","Thương bạn","Giận dữ"],1],
["Dê trắng là người bạn thế nào?",["Lười biếng","Không quan tâm","Rất yêu thương bạn"],2],
["Em an ủi dê trắng thế nào?",["Đừng buồn, cùng tìm bê nhé!","Mặc kệ đi!","Bạn đáng bị thế!"],0],
["Bài thơ khuyên em điều gì?",["Chỉ chơi một mình","Yêu thương bạn bè","Không cần bạn bè"],1],
["Điền từ: “Suối cạn, cỏ héo …”",["xanh","vàng","khô"],2],
["Điền từ: “Chạy khắp … tìm bê”",["nẻo","chỗ","nhà"],0],
["Câu ứng dụng nào viết đúng?",["Học thầy không tày học bạn.","học thầy không tày học bạn.","Học thầy không tài học bạn."],0],
["Câu “Học thầy không tày học bạn” khuyên gì?",["Chỉ học thầy cô","Học hỏi cả từ bạn bè","Không cần đi học"],1],
["Chữ hoa đầu câu ứng dụng là chữ nào?",["K","N","H"],2]
];
var i=-1,sc=[0,0],ch=[null,null],tt=[0,0],t0=0,iv=null,rev=false,run=false,ac=null;
var m=document.getElementById("main"),clk=document.getElementById("clk"),rg=document.getElementById("rg");
function $(x){return document.getElementById(x)}
$("a1").innerHTML=calf(78);$("a2").innerHTML=goat(78);
(function(){for(var t=0;t<2;t++){var h='<div class="pn t'+(t+1)+'"><h3>Nút bấm dự phòng</h3><div class="b">';for(var k=0;k<3;k++)h+='<button id="b'+t+k+'" disabled onclick="pick('+t+','+k+')">'+A[k][0]+'</button>';h+='<button id="rs'+t+'" disabled onclick="undo('+t+')" title="Chọn lại">↺</button></div><div class="st" id="st'+t+'"></div></div>';$("ctl"+t).innerHTML=h}})();
function snd(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function boom(em){for(var k=0;k<24;k++){var s=document.createElement("span");s.className="cf";s.textContent=em[k%em.length];s.style.left=(Math.random()*96)+"vw";s.style.animationDelay=(Math.random()*.5)+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},2600,s)}}
function start(){
 m.innerHTML='<div class="card c"><div class="hero">'+calf(130)+goat(130)+'</div><div class="fr">🍎🍊🍓🍌🍇</div><div class="q">Cùng ôn bài “Gọi bạn” nào!</div><p class="meta" style="font-size:clamp(18px,3vh,30px);margin:0">☝️ 1 ngón = <b>A</b> · ✌️ 2 ngón = <b>B</b> · 🤟 3 ngón = <b>C</b></p><p class="meta" style="margin:0">Bấm “Bật camera” ở khung bên cạnh trước khi bắt đầu · 22 câu · mỗi lượt một bạn giơ 1 tay, chỉ 1–3 ngón là hợp lệ · đúng 100 điểm + thưởng tốc độ tối đa 50 · '+TL+' giây/câu · tự chuyển câu mới sau mỗi lượt</p><div class="act"><button class="big" onclick="snd(660,.15);next()">▶ Bắt đầu</button></div></div>';
}
function next(){
 clearInterval(aT);i++;if(i>=Q.length){return end()}
 ch=[null,null];tt=[0,0];rev=false;run=true;t0=Date.now();wait=[true,true];
 var q=Q[i],rep=Math.ceil((i+1)/2);
 $("no").textContent="Câu "+(i+1)+"/22";
 var h='<div class="card qcard"><span class="badge">⭐ Lượt của bạn số '+rep+'</span><div class="q">'+q[0]+'</div><div class="opts">';
 for(var k=0;k<3;k++)h+='<div class="opt c'+k+'" id="o'+k+'"><div class="bd"><i>'+A[k][0]+'</i><small>'+"ABC".charAt(k)+' · '+A[k][1]+'</small></div><span>'+q[1][k]+'</span></div>';
 h+='</div></div><div class="act"><button class="alt" id="rv" onclick="reveal()">👀 Hiện đáp án</button><button id="nx" class="big" style="display:none" onclick="next()">'+(i==Q.length-1?"🏆 Xem kết quả":"Câu tiếp theo ▶")+'</button><button class="alt" id="pz" style="display:none" onclick="pauseAuto()">⏸ Dừng tự chuyển</button></div>';
 m.innerHTML=h;
 for(var t=0;t<2;t++){$("st"+t).textContent="";$("rs"+t).disabled=false;for(var j=0;j<3;j++){$("b"+t+j).disabled=false;$("b"+t+j).className=""}}
 clearInterval(iv);iv=setInterval(tick,100);tick();
}
var AU=5,aT=null;
function nxLbl(){return i==Q.length-1?"🏆 Xem kết quả":"Câu tiếp theo ▶"}
function autoGo(){clearInterval(aT);var n=AU,b=$("nx");b.textContent=nxLbl()+" ("+n+")";aT=setInterval(function(){n--;if(n<=0){clearInterval(aT);next()}else b.textContent=nxLbl()+" ("+n+")"},1000)}
function pauseAuto(){clearInterval(aT);$("nx").textContent=nxLbl();$("pz").style.display="none"}
function tick(){
 if(!run)return;var l=Math.max(0,TL-(Date.now()-t0)/1000);
 clk.textContent=Math.ceil(l);rg.style.setProperty("--p",l/TL*100);rg.className="ring"+(l<=8?" lo":"");
 if(l<=0)reveal();
}
function pick(t,k,ts){
 if(!run||rev||ch[t]!==null)return;
 ch[t]=k;tt[t]=Math.min(TL,Math.max(0,((ts||Date.now())-t0)/1000));snd(520,.08);
 $("b"+t+k).className="sel";
 for(var j=0;j<3;j++)$("b"+t+j).disabled=true;
 $("st"+t).textContent="Đã chọn "+"ABC".charAt(k)+" sau "+tt[t].toFixed(1)+" giây";
 if(ch[0]!==null&&ch[1]!==null)reveal();
}
function undo(t){
 if(!run||rev||ch[t]===null)return;
 ch[t]=null;for(var j=0;j<3;j++){$("b"+t+j).disabled=false;$("b"+t+j).className=""}
 $("st"+t).textContent="";wait[t]=true;
}
function reveal(){
 if(rev)return;rev=true;run=false;clearInterval(iv);rg.className="ring";
 var c=Q[i][2],any=false;

/* ===== Camera: đếm ngón tay bằng MediaPipe Hand Landmarker ===== */
var cam=false,hl=null,wait=[true,true],hd=[{s:-9,t:0},{s:-9,t:0}],lastT=-1,lastRun=0,V=$("v");
var NM=["1 ngón (A)","2 ngón (B)","3 ngón (C)"];
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function fingers(p){var n=0,w=p[0];[[8,6],[12,10],[16,14],[20,18]].forEach(function(f){if(dist(w,p[f[0]])>dist(w,p[f[1]])*1.1)n++});if(dist(p[4],p[17])>dist(p[2],p[17])*1.2)n++;return n}
function note(x){$("cn0").textContent=x;$("cn1").textContent=x}
function camBtn(d,x){document.querySelectorAll(".cmsg button").forEach(function(b){b.disabled=d;if(x)b.textContent=x})}
async function startCam(){
 camBtn(true);
 try{
  note("Đang bật camera…");
  V.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"},audio:false});await V.play();
  note("Đang tải bộ nhận diện (lần đầu mất vài giây)…");
  var M=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
  var fs=await M.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  var mk=function(d){return M.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:d},runningMode:"VIDEO",numHands:4})};
  try{hl=await mk("GPU")}catch(e){hl=await mk("CPU")}
  cam=true;$("cm0").style.display="none";$("cm1").style.display="none";requestAnimationFrame(loop);
 }catch(e){camBtn(false,"📷 Thử lại");note("Chưa bật được camera. Hãy cho phép dùng camera và mở trang bằng https, hoặc dùng nút bấm bên dưới.")}
}
function loop(){
 if(!cam)return;requestAnimationFrame(loop);
 if(V.readyState<2||V.currentTime===lastT)return;var now=performance.now();if(now-lastRun<66)return;lastRun=now;lastT=V.currentTime;
 var r=hl.detectForVideo(V,now),hs=[[],[]],VW=V.videoWidth,VH=V.videoHeight,w=VW/2;
 (r.landmarks||[]).forEach(function(p){hs[(1-p[9].x)<.5?0:1].push(p)});
 for(var t=0;t<2;t++){
  var s=-2,n=0,d=Date.now();
  if(hs[t].length>1)s=-3;
  else if(hs[t].length==1){n=fingers(hs[t][0]);s=(n>=1&&n<=3)?n-1:-4}
  var c=$("cv"+t),sx=t==0?w:0,cx;c.width=w;c.height=VH;cx=c.getContext("2d");
  cx.save();cx.translate(w,0);cx.scale(-1,1);cx.drawImage(V,sx,0,w,VH,0,0,w,VH);
  hs[t].forEach(function(p){p.forEach(function(q,k){cx.beginPath();cx.arc(q.x*VW-sx,q.y*VH,[4,8,12,16,20].indexOf(k)>=0?9:5,0,7);cx.fillStyle=s>=0?"#ffd23f":"#ff5a6e";cx.fill()})});
  cx.restore();
  if(s!==hd[t].s){hd[t].s=s;hd[t].t=d}
  if(s<0)wait[t]=false;
  var txt="",pct=0;
  if(s===-2)txt=ch[t]!==null?"✅ Đã chọn "+"ABC".charAt(ch[t]):"Chưa thấy tay";
  else if(s===-3)txt="⚠️ Chỉ giơ một tay thôi";
  else if(s===-4)txt="⚠️ Không hợp lệ ("+n+" ngón)";
  else if(ch[t]!==null)txt="✅ Đã chọn "+"ABC".charAt(ch[t]);
  else if(!run||rev)txt="Đang thấy: "+NM[s];
  else if(wait[t])txt="Hạ tay xuống nhé";
  else{pct=Math.min(1,(d-hd[t].t)/HOLD);txt=A[s][0]+" "+NM[s]+" – giữ yên…";if(pct>=1)pick(t,s,hd[t].t)}
  $("l"+t).textContent=(t?"🐐 ":"🐮 ")+txt;$("p"+t).style.width=(pct*100)+"%";
 }
}
start();
